<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><table></table></title>
</head>
<body>
<h2>membuat table</h2>
    <table border="1" >
        <h4>table simple</h4>
        

<tr>
    <td>baris 1 kolom 1  </td>
    <td>baris 1 kolom 2</td>

</tr>
<tr>
<td>baris 2 kolom 1</td>
<td>baris 2 kolom 2</td>

</tr>

    </table>

    <h4>table complex</h4>
    <table   border="1" cellspacing="0" cellpading="10">
        <thead>
<tr>
<th></th>
<th>kolom 1 </th>
<th>kolom 2</th>


</tr>

        </thead>
        <tbody>
<tr>
    <th>baris 1</th>
    <td>baris 1 kolom 2</td>
    <td>baris 1 kolom 2</td>

    



</tr>
<tr>
<th>baris 2</th>
    <td>baris 2 kolom 2</td>
    <td>baris 3 kolom 2</td>


</tr>

        </tbody>
    </table>
    <h4>collspsn</h4>
    <table border="1" cellspacing="0" cellpading="3">
        <tr>
<td colspan="2">1.1</td>

<td>1.3</td>
        </tr>
        
        <tr>
<td>2.1</td>
<td colspan="2">2.2</td>




        </tr>
        <tr>
<td>3.1</td>
<td>3.2</td>
<td>3.3</td>

        </tr>











    </table>
    <h4>rowspan</h4>
    <table border="3">
  <tr>
<td rowspan="2">1.1</td>
<td>2.2</td>
<td>1.3</td>
        </tr>
        
        <tr>

<td >2.2</td>
<td rowspan="2">2.3</td>




        </tr>
        <tr>
<td>3.1</td>
<td>3.2</td>


        </tr>




    </table>

    
</body>
</html>
